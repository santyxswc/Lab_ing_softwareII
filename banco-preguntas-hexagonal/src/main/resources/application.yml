server:
  port: 8085

spring:
  application:
    name: banco-preguntas-hexagonal
  datasource:
    url: jdbc:h2:mem:saberpro_hexagonal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# ==============================================================================
# Selección del Adaptador de Salida de Persistencia (Taller 12 - Paso 1 y Paso 2)
# Valores posibles:
#   - 'jpa'    -> JpaQuestionAdapter (Spring Data JPA + H2) [Paso 1]
#   - 'memory' -> InMemoryQuestionAdapter (ConcurrentHashMap en memoria) [Paso 2]
# ==============================================================================
saberpro:
  repository:
    adapter: jpa

