name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  microkernel:
    name: Taller 05 · Banco de preguntas (Microkernel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banco-preguntas-microkernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  productos-api:
    name: Taller 06 · API REST de productos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: productos-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  saberpro-microservicios:
    name: Parcial 2 · Microservicios Saber PRO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saberpro-microservicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  banco-preguntas-hexagonal:
    name: Taller 12 · Banco de preguntas (DDD + Arquitectura Hexagonal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banco-preguntas-hexagonal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  docker-compose:
    name: Taller 13 · Docker Compose (despliegue y flujo integrador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y levantar el ecosistema
        run: docker compose up -d --build
      - name: Flujo integrador (201 / 400 / 202 y RabbitMQ)
        run: ./saberpro-microservicios/scripts/smoke.sh
      - name: Estado y logs de los contenedores
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 80
      - name: Detener el ecosistema
        if: always()
        run: docker compose down -v
